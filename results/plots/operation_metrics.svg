<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
    <rect width="900" height="600" fill="white"/>

    <text x="450" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">
        Random Access — Element Accesses vs. n
    </text>

    <text x="450" y="570" text-anchor="middle" font-family="Arial" font-size="16">
        Input Size (n)
    </text>

    <text x="25" y="300" text-anchor="middle" font-family="Arial" font-size="16"
          transform="rotate(-90 25 300)">
        Element Accesses
    </text>

    <line x1="90" y1="500" x2="850" y2="500" stroke="black" stroke-width="2"/>
    <line x1="90" y1="80" x2="90" y2="500" stroke="black" stroke-width="2"/>

    <line x1="90" y1="395" x2="850" y2="395" stroke="#dddddd"/>
    <line x1="90" y1="290" x2="850" y2="290" stroke="#dddddd"/>
    <line x1="90" y1="185" x2="850" y2="185" stroke="#dddddd"/>
    <line x1="90" y1="80" x2="850" y2="80" stroke="#dddddd"/>

    <text x="80" y="505" text-anchor="end" font-family="Arial" font-size="12">0</text>
    <text x="80" y="400" text-anchor="end" font-family="Arial" font-size="12">125M</text>
    <text x="80" y="295" text-anchor="end" font-family="Arial" font-size="12">250M</text>
    <text x="80" y="190" text-anchor="end" font-family="Arial" font-size="12">375M</text>
    <text x="80" y="85" text-anchor="end" font-family="Arial" font-size="12">500M</text>

    <text x="140" y="525" text-anchor="middle" font-family="Arial" font-size="12">100</text>
    <text x="360" y="525" text-anchor="middle" font-family="Arial" font-size="12">1,000</text>
    <text x="580" y="525" text-anchor="middle" font-family="Arial" font-size="12">10,000</text>
    <text x="800" y="525" text-anchor="middle" font-family="Arial" font-size="12">100,000</text>

    <polyline
            points="140,500 360,500 580,500 800,500"
            fill="none"
            stroke="#2563eb"
            stroke-width="3"/>

    <circle cx="140" cy="500" r="5" fill="#2563eb"/>
    <circle cx="360" cy="500" r="5" fill="#2563eb"/>
    <circle cx="580" cy="500" r="5" fill="#2563eb"/>
    <circle cx="800" cy="500" r="5" fill="#2563eb"/>

    <polyline
            points="140,499.6 360,495.8 580,457.9 800,76.3"
            fill="none"
            stroke="#dc2626"
            stroke-width="3"/>

    <circle cx="140" cy="499.6" r="5" fill="#dc2626"/>
    <circle cx="360" cy="495.8" r="5" fill="#dc2626"/>
    <circle cx="580" cy="457.9" r="5" fill="#dc2626"/>
    <circle cx="800" cy="76.3" r="5" fill="#dc2626"/>

    <line x1="610" y1="55" x2="640" y2="55" stroke="#2563eb" stroke-width="3"/>
    <text x="650" y="60" font-family="Arial" font-size="14">Dynamic Array</text>

    <line x1="610" y1="75" x2="640" y2="75" stroke="#dc2626" stroke-width="3"/>
    <text x="650" y="80" font-family="Arial" font-size="14">Linked List</text>
</svg>